<!DOCTYPE html>
<html>
<head>
 <title>Odd Even Checker (0–15)</title>
<!B.POOJASREE AV.SC.U4CSE25103>
 <style>
 body {
 font-family: Arial, sans-serif;
 background: linear-gradient(135deg, #b92c2c, #820818);
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 margin: 0;
 }
 .box {
 background: white;
 padding: 30px;
 width: 350px;
 border-radius: 15px;
 box-shadow: 0 10px 25px rgba(0,0,0,0.2);
 text-align: center;
 }
 button {
 padding: 10px 20px;
 background: linear-gradient(135deg, #dd0e11, #a24b61);
 color: white;
 border: none;
 border-radius: 8px;
 cursor: pointer;
 margin-bottom: 15px;
 }
 #output {
 text-align: left;
 max-height: 250px;
 overflow-y: auto;
 padding: 10px;
 border: 1px solid #ccc;
 border-radius: 10px;
 }
 .even {
 color: rgb(15, 0, 128);
 }
.odd {
 color: rgb(21, 0, 255);
 } 
 </style>
</head>
<body>
<div class="box">
 <h2>Odd / Even from 0 to 15</h2>
<button onclick="checkNumbers()">Show Result</button>
 <div id="output"></div>
</div>
<script>
function checkNumbers() {
 let output = document.getElementById("output");
 output.innerHTML = ""; // clear previous result
 for (let i = 0; i <= 15; i++) {
 if (i % 2 === 0) {
 output.innerHTML += "<p class='even'>" + i + " is Even</p>";
 } else {
 output.innerHTML += "<p class='odd'>" + i + " is Odd</p>";
 }
 }
}
</script>
</body>
</html>
