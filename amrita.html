<!DOCTYPE html>
<html>
<head>
<title>Amrita Login Page</title>
<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(to right,light orange, pale pink);
background: url(https://wallpapers.com/images/hd/cool-light-blue-l6csxyf32ij7t1or.jpg) no-repeat center center/cover
 }
/* Header */
.header {
background-color:lightcoral;
color: white;
text-align: center;
padding: 15px;
font-size: 28px;
font-weight: bold; }
/* Navigation */
.nav {
background-color:darkcyan;
text-align: center;
padding: 10px; }
.nav button {
background: transparent;
border: none;
color:lightgoldenrodyellow;
font-size: 16px;
margin: 0 15px;
cursor: pointer; }
.nav button:hover {
  text-decoration: underline; }
/* Main Layout */
.container {
display: flex;
justify-content: center;
align-items: flex-start;
margin: 40px;
gap: 40px; }
/* Login Box */
.login-box {
background: linear-gradient(to bottom,darkviolet,lightcoral);
padding: 25px; 
 width: 300px;
border-radius: 10px;
color:darkcyan; }
.login-box h2 {
text-align: center; }
.login-box input {
width: 100%;
padding: 8px;
margin: 10px 0;
border: none;
border-radius: 4px;}
.login-box button {
width: 100%;
padding: 8px;
background-color:darkseagreen;
color:light turquoise;
border: none;
border-radius: 4px;
cursor: pointer;}
/* Campus Details */
.campus-details {
background:palegoldenrod;
width: 500px;
padding: 20px;
border-radius: 10px; }
.campus-details img {
width: 100%;
height: 200px;
object-fit: cover;
margin-top: 10px; }
</style>
</head>
<body>
<div class="header">
AMRITA VISHWA VIDHYAPEETAM
</div>
<div class="nav">
<button onclick="showCampus('coimbatore')">Coimbatore</button>
<button onclick="showCampus('amritapuri')">Amritapuri</button>
<button onclick="showCampus('bangalore')">Bangalore</button>
<button onclick="showCampus('chennai')">Chennai</button>
<button onclick="showCampus('Amaravathi')">Amaravathi</button>
</div>
<div class="container">
<!-- Login Section -->
<div class="login-box">
<h2>Login</h2>
<input type="text" placeholder="Email">
<input type="password" placeholder="Password">
<button>Login</button>
</div>
<!-- Campus Info Section -->
<div class="campus-details" id="campusInfo">
<h2>About the Campus</h2>
<p>Select a campus from above to view details.</p>
</div>
<script>
function showCampus(campus) {
let info = document.getElementById("campusInfo");
if (campus === "coimbatore") {
info.innerHTML = `
 <h2>Coimbatore Campus</h2>
 <p>Located in Tamil Nadu. Known for Engineering and Technology programs with modern infrastructure.</p>
 <img src="https://tse3.mm.bing.net/th/id/OIP.elkN6U_aVSlLuBTcPX2q_QHaEK?pid=Api&P=0&h=180"
alt="Coimbatore Campus"> `; }
else if (campus === "amritapuri") {
info.innerHTML = `
 <h2>Amritapuri Campus</h2>
 <p>Located in Kerala. Famous for Arts, Science and research activities in a peaceful environment.</p>
 <img src="https://tse4.mm.bing.net/th/id/OIP.jPuLxk4ALi6yUzvKevF7fgHaEM?pid=Api&P=0&h=180" alt="Amritapuri
Campus"> `;}
else if (campus === "bangalore") {
info.innerHTML = `
 <h2>Bangalore Campus</h2>
 <p>Located in Karnataka. Offers Engineering and Management programs with industry exposure.</p>
 <img src="https://tse4.mm.bing.net/th/id/OIP.AxDXEuEdONmn1Poym0qaiQHaDt?pid=Api&P=0&h=180"
alt="Bangalore Campus">`; }
else if (campus === "chennai") {
info.innerHTML = `
 <h2>Chennai Campus</h2>
 <p>Located in Tamil Nadu. Special focus on engineering disciplines and innovation.</p>
 <img src="https://tse2.mm.bing.net/th/id/OIP.5Cd4ekgT1P_EX7zhzH_D1AHaDp?pid=Api&P=0&h=180"
alt="Chennai Campus">
 `;
 }
else if (campus === "Amaravathi") {
info.innerHTML = `
 <h2>Amaravathi Campus</h2>
 <p>Located in Mangalagiri. Famous for Arts, Science and research activities in a peaceful environment.</p>
 <img src="https://tse4.mm.bing.net/th/id/OIP.WIKj0_HGLKy7-vepQuwuLwHaDK?pid=Api&P=0&h=180"
alt="Amaravathi Campus">;}}
</script>
</body>
</html>
