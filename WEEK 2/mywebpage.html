<!DOCTYPE html>
<html>
<head>
<title>Simple Web Page Demo</title>
<style>
/* Background color and image */
body {
background-color: antiquewhite; /* Background color */
background-image: url("https://wallpapers.com/images/hd/aesthetic-computer-pictures-yd6kon54y013rjzh.jpg");
background-repeat: no-repeat;
background-size: cover;
background-attachment: fixed;
font-family: Arial, sans-serif }
/* Heading styling */
h1 {
color: blueviolet;
text-align: center;
text-decoration: underline;
font-size: 40px; }
h2 { color: darkred;
margin-left: 20px;}
/* Paragraph styling */
p { font-size: 18px;
margin-left: 20px; }
/* Preformatted text styling */
pre {
background-color: white;
padding: 15px;
border: 2px solid black;
width: fit-content;
margin-left: 20px;}
</style>
</head>
<body>
<h1>Welcome to My Web Page</h1>
<h2>About This Page</h2>
<p>This page demonstrates background color, background image, heading styling, and preformatted text in HTML.</p>
<h2>Sample Preformatted Text</h2>
<pre>
Name : gayathri
Course : user interface design
College : Amrita University
</pre></body></html>
