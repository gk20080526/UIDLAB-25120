<!DOCTYPE html>
<html>
<head>
    <title>Card Layout with Images</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .card{
            background-color: white;
            width: 260px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            overflow: hidden;
            text-align: center;
        }

        .card img{
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card h3{
            margin: 15px 0 10px 0;
        }

        .card p{
            font-size: 14px;
            padding: 0 15px;
            color: gray;
        }

        .card button{
            margin: 15px 0 20px 0;
            padding: 8px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover{
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="Image 1">
            <h3>Card 1</h3>
            <p>This is the first card description.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?2" alt="Image 2">
            <h3>Card 2</h3>
            <p>This is the second card description.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <img src="https://picsum.photos/300/200?3" alt="Image 3">
            <h3>Card 3</h3>
            <p>This is the third card description.</p>
            <button>Read More</button>
        </div>

    </div>

</body>
</html>
