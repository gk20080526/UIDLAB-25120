<!DOCTYPE html>
<html>
<head>
    <title>Sign of Product</title>
</head>

<body>

<h2>Find Sign of Product of 3 Numbers</h2>

<!-- Input boxes -->
<input type="number" id="num1" placeholder="Enter first number"><br><br>
<input type="number" id="num2" placeholder="Enter second number"><br><br>
<input type="number" id="num3" placeholder="Enter third number"><br><br>

<!-- Button -->
<button onclick="findSign()">Check Sign</button>

<script>
function findSign() {
    let a = parseInt(document.getElementById("num1").value);
    let b = parseInt(document.getElementById("num2").value);
    let c = parseInt(document.getElementById("num3").value);

    let product = a * b * c;

    if (product > 0) {
        alert("The sign is plus");
    } else if (product < 0) {
        alert("The sign is minus");
    } else {
        alert("the product is zero ");
    }
}
</Script>
</body> 
</html>
