<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .weak {
            color: red;
        }

        .medium {
            color: orange;
        }

        .strong {
            color: green;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Password Strength Checker</h2>

        <input type="password" id="password" placeholder="Enter Password" onkeyup="checkPassword()">

        <div id="message"></div>
    </div>

    <script>
        function checkPassword() {
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (password.length < 6) {
                message.innerHTML = "Weak Password";
                message.className = "weak";
            }
            else if (password.match(/[A-Z]/) &&
                     password.match(/[0-9]/) &&
                     password.match(/[@#$%^&*!]/)) {

                message.innerHTML = "Strong Password";
                message.className = "strong";
            }
            else {
                message.innerHTML = "Medium Password";
                message.className = "medium";
            }
        }
    </script>

</body>
</html>
